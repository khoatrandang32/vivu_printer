name: Build & Release VIVU Printer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build and Publish Installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always

      - name: Create & Upload Hot Update Bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Compress-Archive -Path server.js,configManager.js,mdnsService.js,returnSlipPrint.js,otherCarrierShipPrint.js,ghtkLabelStamper.js,public,package.json,main.js -DestinationPath bundle.zip -Force
          $tag = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME } else { "v" + (Get-Content package.json | ConvertFrom-Json).version }
          gh release upload $tag bundle.zip --clobber
